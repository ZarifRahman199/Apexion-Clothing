<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apexion Clothing | Premium Streetwear</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-black tracking-wider text-cyan-400">APEXION</a>
            <nav class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="index.html" class="text-cyan-400">Home</a>
                <a href="shop.html" class="hover:text-cyan-400 transition">Shop</a>
                <a href="cart.html" class="hover:text-cyan-400 transition flex items-center gap-1">
                    Cart <span id="cart-count" class="bg-cyan-500 text-slate-950 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="relative py-24 lg:py-32 flex items-center justify-center text-center px-6 overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(6,182,212,0.15)_0,transparent_70%)]"></div>
        <div class="relative max-w-3xl space-y-6">
            <h1 class="text-4xl lg:text-6xl font-extrabold tracking-tight">Elevate Your Style with <span class="text-cyan-400">Apexion</span></h1>
            <p class="text-slate-400 text-lg">High-quality custom apparel built for modern comfort and relentless ambition.</p>
            <div>
                <a href="shop.html" class="inline-block bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-8 py-3 rounded-xl transition shadow-lg shadow-cyan-500/20">
                    Explore Collection
                </a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-8 text-center text-xs text-slate-500">
        &copy; 2026 Apexion Clothing. All rights reserved.
    </footer>

    <script>
        // Global cart utility counter display update
        const cart = JSON.parse(localStorage.getItem('apexion_cart')) || [];
        document.getElementById('cart-count').innerText = cart.length;
    </script>
</body>
</html>
