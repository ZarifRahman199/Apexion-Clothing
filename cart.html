<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Apexion Clothing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-black tracking-wider text-cyan-400">APEXION</a>
            <nav class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="index.html" class="hover:text-cyan-400 transition">Home</a>
                <a href="shop.html" class="hover:text-cyan-400 transition">Shop</a>
                <a href="cart.html" class="text-cyan-400 flex items-center gap-1">
                    Cart <span id="cart-count" class="bg-cyan-500 text-slate-950 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Cart Layout -->
    <main class="max-w-4xl mx-auto px-6 py-12">
        <h2 class="text-3xl font-bold mb-8">Shopping Cart</h2>
        
        <div id="cart-container" class="space-y-4">
            <!-- Dynamic Cart Items Render Here -->
        </div>

        <div id="checkout-section" class="mt-8 border-t border-slate-800 pt-6 hidden">
            <div class="flex justify-between text-xl font-bold mb-6">
                <span>Total:</span>
                <span id="cart-total" class="text-cyan-400">$0.00</span>
            </div>
            <button onclick="checkout()" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-cyan-500/20">
                Proceed to Secure Checkout
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-8 text-center text-xs text-slate-500 mt-20">
        &copy; 2026 Apexion Clothing. All rights reserved.
    </footer>

    <script>
        let cart = JSON.parse(localStorage.getItem('apexion_cart')) || [];
        const container = document.getElementById('cart-container');
        const checkoutSection = document.getElementById('checkout-section');

        function renderCart() {
            container.innerHTML = "";
            document.getElementById('cart-count').innerText = cart.length;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-slate-400">Your cart is empty. <a href="shop.html" class="text-cyan-400 underline">Go shopping</a>.</p>`;
                checkoutSection.classList.add('hidden');
                return;
            }

            checkoutSection.classList.remove('hidden');
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-xl">
                        <div class="flex items-center gap-4">
                            <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg bg-slate-800">
                            <div>
                                <h4 class="font-bold">${item.name}</h4>
                                <p class="text-cyan-400 text-sm">$${item.price.toFixed(2)}</p>
                            </div>
                        </div>
                        <button onclick="removeItem(${index})" class="text-red-400 hover:text-red-300 text-sm font-medium">Remove</button>
                    </div>
                `;
            });

            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('apexion_cart', JSON.stringify(cart));
            renderCart();
        }

        function checkout() {
            alert("Simulated Checkout Success! In production, this trigger connects to a backend server function to push the order payload straight to your Printify API endpoint.");
            localStorage.removeItem('apexion_cart');
            cart = [];
            renderCart();
        }

        renderCart();
    </script>
</body>
</html>
