<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Collection | Apexion Clothing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <!-- Navigation Bar -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-black tracking-wider text-cyan-400">APEXION</a>
            <nav class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="index.html" class="hover:text-cyan-400 transition">Home</a>
                <a href="shop.html" class="text-cyan-400">Shop</a>
                <a href="cart.html" class="hover:text-cyan-400 transition flex items-center gap-1">
                    Cart <span id="cart-count" class="bg-cyan-500 text-slate-950 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Store Container -->
    <main class="max-w-7xl mx-auto px-6 py-12">
        <div class="mb-10 text-center">
            <h2 class="text-3xl font-bold">Featured Drops</h2>
            <p class="text-slate-400 mt-2">Pick your style. Direct Print-on-Demand execution.</p>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Products get injected dynamically via JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-8 text-center text-xs text-slate-500">
        &copy; 2026 Apexion Clothing. All rights reserved.
    </footer>

    <script>
        // Sample store items (Matches your Printify catalog concept)
        const products = [
            { id: 1, name: "Apexion Classic Heavyweight Tee", price: 29.99, image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500&auto=format&fit=crop&q=60" },
            { id: 2, name: "Apexion Cybernetic Hoodie", price: 54.99, image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500&auto=format&fit=crop&q=60" },
            { id: 3, name: "Apexion Minimalist Cap", price: 21.99, image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=500&auto=format&fit=crop&q=60" }
        ];

        let cart = JSON.parse(localStorage.getItem('apexion_cart')) || [];
        document.getElementById('cart-count').innerText = cart.length;

        const grid = document.getElementById('product-grid');
        products.forEach(p => {
            grid.innerHTML += `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col group">
                    <div class="h-64 overflow-hidden bg-slate-800">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-6 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-bold text-lg">${p.name}</h3>
                            <p class="text-cyan-400 font-semibold mt-1">$${p.price.toFixed(2)}</p>
                        </div>
                        <button onclick="addToCart(${p.id})" class="mt-6 w-full bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 font-medium py-2.5 rounded-xl transition">
                            Add to Cart
                        </button>
                    </div>
                </div>
            `;
        });

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            cart.push(item);
            localStorage.setItem('apexion_cart', JSON.stringify(cart));
            document.getElementById('cart-count').innerText = cart.length;
            alert(`${item.name} added to cart!`);
        }
    </script>
</body>
</html>
